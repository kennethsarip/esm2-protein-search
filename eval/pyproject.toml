[project]
name = "esm2-search-eval"
version = "0.1.0"
description = "Remote-homology benchmark harness: SCOPe loader, BLAST/MMseqs2 runners, scoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
