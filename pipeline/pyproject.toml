[project]
name = "esm2-search-pipeline"
version = "0.1.0"
description = "Swiss-Prot ingest and ESM-2 embedding pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "fair-esm>=2.0",
    "biopython>=1.84",
    "polars>=1.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
